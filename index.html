<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Pendaftaran Ekskul SMK Letris Pamulang</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- CSS External -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="main-wrapper">
    <!-- Header -->
    <header class="app-header">
      <h1 class="header-title">Form Pendaftaran Ekskul<br>SMK Letris Pamulang</h1>
    </header>

    <div class="grid-container">
      <!-- Form Card -->
      <section class="card form-card">
        <div class="card-header">
          <h2>Form Pendaftaran</h2>
          <p>Silakan isi data calon anggota ekskul di bawah ini</p>
        </div>

        <form id="ekskulForm">
          <!-- Nama Lengkap -->
          <div class="form-group">
            <label for="nama">Nama Lengkap:</label>
            <input type="text" id="nama" class="form-control" placeholder="Masukkan nama siswa" required>
          </div>

          <!-- Kelas (Radio Button Asli & Terlihat Jelas) -->
          <div class="form-group">
            <label>Kelas:</label>
            <div class="radio-group">
              <label class="radio-label">
                <input type="radio" name="kelas" value="X" required>
                <span>X</span>
              </label>
              <label class="radio-label">
                <input type="radio" name="kelas" value="XI">
                <span>XI</span>
              </label>
              <label class="radio-label">
                <input type="radio" name="kelas" value="XII">
                <span>XII</span>
              </label>
            </div>
          </div>

          <!-- Jurusan -->
          <div class="form-group">
            <label for="jurusan">Jurusan:</label>
            <select id="jurusan" class="form-control" required>
              <option value="" disabled selected>-- Pilih Jurusan --</option>
              <option value="PPLG">PPLG</option>
              <option value="DKV">DKV</option>
              <option value="TJKT">TJKT</option>
              <option value="AKL">AKL</option>
              <option value="BDP">BDP</option>
              <option value="MPLB">MPLB</option>
            </select>
          </div>

          <!-- Pilihan Ekskul -->
          <div class="form-group">
            <label for="ekskul">Pilihan Ekskul:</label>
            <select id="ekskul" class="form-control" required>
              <option value="" disabled selected>-- Pilih Ekstrakurikuler --</option>
              <option value="animasi">animasi</option>
              <option value="paskibra">paskibra</option>
              <option value="volly">volly</option>
              <option value="basket">basket</option>
              <option value="futsal">futsal</option>
              <option value="letsin">letsin</option>
              <option value="pmr">pmr</option>
              <option value="dance modern">dance modern</option>
            </select>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="btnSubmit" class="btn btn-submit">
            Tambah Data
          </button>
        </form>
      </section>

      <!-- Table Card -->
      <section class="card table-card">
        <div class="card-header flex-header">
          <div>
            <h2>Data Pendaftaran Siswa</h2>
            <p>Daftar siswa yang sudah mendaftar</p>
          </div>
          <div class="counter-badge" id="dataCounter">0 Siswa</div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th style="width: 50px;">No</th>
                <th>Nama</th>
                <th>Kelas</th>
                <th>Jurusan</th>
                <th>Ekskul</th>
                <th style="width: 150px; text-align: center;">Aksi</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <!-- JavaScript External -->
  <script src="script.js"></script>
</body>
</html>
